# Configuración de pruebas: base H2 en memoria, sin PostgreSQL ni clave de IA
spring.datasource.url=jdbc:h2:mem:hotel_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=clave-de-pruebas-hotel-princes-ica-de-32-caracteres
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:3000
asistente.ia.api-key=
