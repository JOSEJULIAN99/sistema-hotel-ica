server.port=${PORT:8080}
spring.application.name=hoteleria

# Lee el archivo .env de la raíz si existe (ejecución con ./mvnw); en Docker las variables llegan por env_file
spring.config.import=optional:file:.env[.properties]

# ========================================================
# Base de datos PostgreSQL (valores desde variables de entorno, ver .env.example)
# ========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_princes_ica}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:hotel_user}
spring.datasource.password=${DB_PASSWORD:hotel_password_123}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# CORS: orígenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Seguridad JWT (definir JWT_SECRET en producción, mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-hotel-princes-ica-cambiar-en-produccion}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# IA generativa libre (Llama). IA_PROVEEDOR: groq | ollama | ninguno
# Sin IA, el chatbot y el asistente responden con reglas fijas.
ia.proveedor=${IA_PROVEEDOR:ninguno}
ia.base-url=${IA_BASE_URL:}
ia.api-key=${IA_API_KEY:}
ia.modelo=${IA_MODELO:}
ia.max-tokens=${IA_MAX_TOKENS:700}
ia.temperatura=0.4

# Fotos de habitaciones: STORAGE_TIPO=supabase (recomendado) o local
app.storage.tipo=${STORAGE_TIPO:local}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:habitaciones}
# URL pública del backend (para las fotos en disco local)
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Formato JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Lima
