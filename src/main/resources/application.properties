server.port=${PORT:8080}
spring.application.name=hoteleria

# ========================================================
# Base de datos PostgreSQL (valores desde variables de entorno, ver .env.example)
# ========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_princes_ica}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:hotel_user}
spring.datasource.password=${DB_PASSWORD:hotel_password_123}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# CORS: orígenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Formato JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Lima
