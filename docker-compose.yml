services:
  # ========================================================
  # Base de Datos PostgreSQL 16
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: hotel_princes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_princes_ica
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password_123
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montaje automático del script de inicialización con datos reales
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_princes_ica"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hotel_network

  # ========================================================
  # pgAdmin 4 (Administrador Web de PostgreSQL)
  # ========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotel_princes_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotelprincesica.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - hotel_network

volumes:
  postgres_data:
    name: hotel_princes_postgres_data
  pgadmin_data:
    name: hotel_princes_pgadmin_data

networks:
  hotel_network:
    name: hotel_princes_network
