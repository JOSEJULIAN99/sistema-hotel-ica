services:
  # ========================================================
  # Base de Datos PostgreSQL 16
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: hotel_princes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_princes_ica}
      POSTGRES_USER: ${DB_USER:-hotel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel_password_123}
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montaje automático del script de inicialización con datos reales
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hotel_network

  # ========================================================
  # pgAdmin 4 (Administrador Web de PostgreSQL)
  # ========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotel_princes_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hotelprincesica.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - hotel_network

  # ========================================================
  # Backend Spring Boot (perfil "app": docker compose --profile app up -d)
  # ========================================================
  backend:
    build: .
    container_name: hotel_princes_backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-hotel_princes_ica}
      DB_USER: ${DB_USER:-hotel_user}
      DB_PASSWORD: ${DB_PASSWORD:-hotel_password_123}
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-hotel-princes-ica-cambiar-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: America/Lima
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_network

  # ========================================================
  # Frontend Next.js
  # ========================================================
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: hotel_princes_frontend
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hotel_network

volumes:
  postgres_data:
    name: hotel_princes_postgres_data
  pgadmin_data:
    name: hotel_princes_pgadmin_data

networks:
  hotel_network:
    name: hotel_princes_network
