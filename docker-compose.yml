# Sistema Hotel Princes Ica: todo el proyecto con Docker.
# Las claves se leen de .env (copiar .env.example como .env). Comandos:
#   docker compose --profile local up -d --build        -> con PostgreSQL local en Docker
#   docker compose up -d --build                         -> con Supabase (DB_URL en .env)
#   agregar --profile ia-local                           -> además Llama local con Ollama
#   agregar --profile herramientas                       -> además pgAdmin

name: hotel-princes-ica

services:
  # ------------------------------------------------------------------
  # Base de datos PostgreSQL 16 (solo con --profile local)
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    profiles: ["local"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_princes_ica}
      POSTGRES_USER: ${DB_USER:-hotel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      TZ: America/Lima
    ports:
      - "${DB_PUERTO_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Backend Spring Boot
  # ------------------------------------------------------------------
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de Docker la base local se llama "db"; con Supabase se usa DB_URL tal cual
      DB_URL: ${DB_URL_DOCKER:-${DB_URL}}
      TZ: America/Lima
    ports:
      - "${BACKEND_PUERTO_HOST:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
        required: false
      ollama:
        condition: service_started
        required: false
    volumes:
      - uploads_data:/app/uploads

  # ------------------------------------------------------------------
  # Frontend Next.js
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_MODO_DEMO: ${NEXT_PUBLIC_MODO_DEMO:-false}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUERTO_HOST:-3000}:3000"
    depends_on:
      - backend

  # ------------------------------------------------------------------
  # IA local con Ollama y Llama (solo con --profile ia-local)
  # La primera vez descarga el modelo (~2 GB para llama3.2:3b).
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    profiles: ["ia-local"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODELO:-llama3.2:3b} && wait"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # ------------------------------------------------------------------
  # pgAdmin (solo con --profile herramientas)
  # ------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["herramientas"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hotelprincesica.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
  pgadmin_data:
